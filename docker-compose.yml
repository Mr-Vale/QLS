version: "3.8"

services:
  # Static file server for the dashboard
  frontend:
    image: nginx:alpine
    container_name: qls-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/usr/share/nginx/html:ro
    depends_on:
      - status-api

  # Lightweight container status API
  status-api:
    build:
      context: .
      dockerfile: Dockerfile.status
    container_name: qls-status
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Optionally restrict to specific containers (comma-separated)
      CONTAINERS: ""
      PORT: "5000"
