version: "3.8"

services:
  qls:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qls
    restart: unless-stopped
    ports:
      - "5555:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - qls-data:/data
    environment:
      # Optionally restrict Docker container status to specific containers (comma-separated)
      CONTAINERS: ""
      PORT: "5000"

volumes:
  qls-data:
